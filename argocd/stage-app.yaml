apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mahi3297/devops-cicd-project.gitt
    targetRevision: HEAD
    path: helm/webapp
    helm:
      valueFiles:
        - values-stage.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
